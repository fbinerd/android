# Configuração do Perfil de Hardware: Aquário STV3000
BOARD_NAME="Aquário STV3000"
BOARD_MODEL="aquario-stv3000"
SOC_FAMILY="amlogic-s905w"
SOC_MODEL="S905W"
ARCH="arm64"

# Parâmetros do Android
ANDROID_VERSION="9"
ANDROID_BUILD_TYPE="userdebug"
AOSP_DEVICE_TREE="device/amlogic/stv3000"

# Parâmetros de Memória & Kernel
KERNEL_VERSION="4.9.113"
KERNEL_DEFCONFIG="stv3000_defconfig"
CMA_SIZE_MB="224"
CMA_NAME="codec_mm_cma"
GPIO_LED_STANDBY="474" # GPIODV_24

# Arvores externas validadas no firmware-lab. Todas podem ser substituidas
# pelo ambiente sem editar o perfil.
FIRMWARE_LAB_DIR="${FIRMWARE_LAB_DIR:-/media/dados_2tb/opw/openwrt-build-tools/tools/firmware-lab}"
KERNEL_SOURCE_WORKDIR="${KERNEL_SOURCE_WORKDIR:-work/khadas-patch-validation-clone}"
KERNEL_OUTPUT_WORKDIR="${KERNEL_OUTPUT_WORKDIR:-work/build-khadas-patch-validation-2}"
WIFI_SOURCE_WORKDIR="${WIFI_SOURCE_WORKDIR:-work/ssv6xxx-khadas-vims-pie}"
MALI_BUILD_WORKDIR="${MALI_BUILD_WORKDIR:-work/build-mali-r7p0-exact-kernel-20260802}"
RAMDISK_ROOT_WORKDIR="${RAMDISK_ROOT_WORKDIR:-work/teste-khadas-fresh-20260730-apps-metrics-v46/ramdisk-root}"
DTB_BASE_WORKDIR="${DTB_BASE_WORKDIR:-work/boot-performance-v69-20260730/aquario-performance-v69.dtb}"
BASE_IMAGE="${BASE_IMAGE:-workspace/aquario_base.img}"
BUILD_CONTAINER="${BUILD_CONTAINER:-android9-aquario}"
BUILD_JOBS="${BUILD_JOBS:-16}"

# Presets de Armazenamento, Layout e Swap para o Cartão SD de 32GB Detectado (/dev/sdg)
FLASH_SIZE_GB="32g"       # Preset de 32 GB ativado
STORAGE_MEDIUM="sdcard"   # Destino: Cartão SD Externo
SWAP_TYPE="zram_256m"     # Swap ZRAM em RAM

# Configuração Flexível do Bootloader U-Boot
UBOOT_MODE="prebuilt"
UBOOT_PREBUILT_BIN="target/linux/amlogic/s905w/aquario-stv3000/prebuilts/uboot-gxl_p281_v1.bin"
UBOOT_DEFCONFIG="gxl_p281_v1_defconfig"
UBOOT_TARGET="gxl_p281_v1"
UBOOT_HANDOFF_DOT="1"
SD_FAILFAST_FIX="1"

# Layout de Partições
PARTITION_TABLE="ept_32gb_standard.json"
SYSTEM_PART_SIZE_MB="3072"
